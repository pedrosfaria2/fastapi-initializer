[project]
name = "fastapi-initializr"
version = "0.1.0"
description = "Generate ready-to-run FastAPI projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "fastapi-cli",
    "jinja2",
    "pydantic-settings",
    "pygments",
    "python-multipart",
    "uvicorn[standard]",
]

[project.scripts]
fastapi-initializr = "fastapi_initializr.cli:main"

[tool.fastapi]
entrypoint = "fastapi_initializr.main:app"

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "playwright",
    "pyright",
    "pytest",
    "ruff",
    "types-pygments",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_initializr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
    "S",
    "PT",
    "RUF",
    "N",
    "A",
    "C4",
    "PTH",
    "RET",
    "ARG",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"scripts/*" = ["T201", "S603"]
"src/fastapi_initializr/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
show_error_codes = true
warn_unreachable = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
markers = ["browser: requires Playwright browsers"]

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv run playwright install --with-deps chromium
      - run: bash scripts/check-all.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the generator image
        run: docker build --progress=plain --tag fastapi-initializr:ci .
      - name: Record image size
        run: docker image inspect --format '{{.Size}} bytes' fastapi-initializr:ci
      - name: Smoke test the image
        run: |
          docker run --detach --name initializr --publish 8000:8000 fastapi-initializr:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs initializr
          exit 1
      - name: Stop the image
        if: always()
        run: docker rm --force initializr || true
